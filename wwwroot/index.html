<!DOCTYPE html>
<html>
<head>
    <title>Cultcord</title>
    <link rel="stylesheet" href="/resources/site.css?piss=2">
</head>
<body>
    <div id="content">
    </div>
</body>
<script src="/resources/contentStitcher.js" type="module"></script>
<script src="/resources/lib/glslCanvas.js"></script>
<script src="/resources/bgShader.js"></script>
<script>
    function RefreshContent()
    {
        document.querySelectorAll("#kb").forEach(el => {
            el.addEventListener("mouseenter", () => document.documentElement.classList.add("knucklebones"));
            el.addEventListener("mouseleave", () => document.documentElement.classList.remove("knucklebones"));
        });

        document.querySelectorAll("#fl").forEach(el => {
            el.addEventListener("mouseenter", () => document.documentElement.classList.add("flockade"));
            el.addEventListener("mouseleave", () => document.documentElement.classList.remove("flockade"));
        });

        document.querySelectorAll("#dsc").forEach(el => {
            el.addEventListener("mouseenter", () => document.documentElement.classList.add("discord"));
            el.addEventListener("mouseleave", () => document.documentElement.classList.remove("discord"));
        });
    }

    window.addEventListener("display:refresh", RefreshContent);
</script>
</html>
